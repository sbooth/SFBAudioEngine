name: Swift
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: |
          set -o pipefail
          swift build 2>&1 | xcbeautify --renderer github-actions
      - name: Run tests
        run: swift test -v
