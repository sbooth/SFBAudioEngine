name: Swift
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Checkout
        uses: actions/checkout@v7
      # macOS
      - name: Build for macOS
        run: swift build -v
      - name: Run tests for macOS
        run: swift test -v
      # iOS
      - name: Build for iOS
        run: |
          xcodebuild build \
            -scheme SFBAudioEngine \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
      # iOS Simulator
      - name: Build and run tests for iOS simulator
        run: |
          xcodebuild test \
            -scheme SFBAudioEngine \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO
